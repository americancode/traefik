---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami-missing
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whoami-missing
  template:
    metadata:
      labels:
        app: whoami-missing
    spec:
      containers:
        - name: whoami
          image: traefik/whoami
          ports:
            - containerPort: 80
