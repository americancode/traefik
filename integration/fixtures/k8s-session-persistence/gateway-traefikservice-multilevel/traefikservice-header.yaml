---
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: ts-multi-header
  namespace: default
spec:
  weighted:
    sticky:
      header:
        name: X-TS-WRR
    services:
      - name: whoami-ts-a-header
        port: 80
        sticky:
          header:
            name: X-TS-SVC
      - name: whoami-ts-b-header
        port: 80
        sticky:
          header:
            name: X-TS-SVC
