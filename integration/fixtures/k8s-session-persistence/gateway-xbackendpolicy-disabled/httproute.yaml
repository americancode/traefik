---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami-xbtp-disabled
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
  hostnames:
    - whoami-xbtp-disabled.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: whoami-xbtp-disabled
          port: 80
