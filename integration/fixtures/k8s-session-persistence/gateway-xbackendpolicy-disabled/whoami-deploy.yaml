---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami-xbtp-disabled
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whoami-xbtp-disabled
  template:
    metadata:
      labels:
        app: whoami-xbtp-disabled
    spec:
      containers:
        - name: whoami
          image: traefik/whoami
          ports:
            - containerPort: 80
