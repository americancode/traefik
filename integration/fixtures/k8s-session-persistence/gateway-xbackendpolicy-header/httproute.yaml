---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami-xbtp
  namespace: default
spec:
  parentRefs:
    - name: my-gateway
  hostnames:
    - whoami-xbtp.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: whoami-xbtp
          port: 80
