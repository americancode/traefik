---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami-ts-attrs-a
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami-ts-attrs-a
  template:
    metadata:
      labels:
        app: whoami-ts-attrs-a
    spec:
      containers:
        - name: whoami
          image: traefik/whoami
          ports:
            - containerPort: 80
