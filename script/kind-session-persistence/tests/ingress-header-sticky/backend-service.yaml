---
apiVersion: v1
kind: Service
metadata:
  name: whoami-ingress-sticky
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.header: "true"
    traefik.ingress.kubernetes.io/service.sticky.header.name: X-Ingress-Sticky
spec:
  ports:
    - name: http
      port: 80
  selector:
    app: whoami-ingress-sticky
